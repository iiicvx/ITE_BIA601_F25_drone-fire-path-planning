# إعدادات دالة الهدف المشتركة لجميع الخوارزميات:
#   F_k = w_T*J_T + w_E*J_E + w_H*J_H + w_S*J_S
#   F   = mean_k F_k + M * V + P0 * [V > 0]

weights:
  w_T: 1.0    # وزن زمن وطول المسار
  w_E: 0.5    # وزن استهلاك الطاقة والصعود
  w_H: 10.0   # وزن تجنب الخطر الحراري والدخان
  w_S: 0.5    # وزن نعومة المسار وتقليل الانعطاف الحاد

penalty:
  M: 1000     # معامل عقوبة انتهاك القيود
  P0: 100     # عقوبة ثابتة لأي مسار غير آمن

init:         # إعدادات التهيئة الابتدائية لـ GA و PSO
  line_fraction: 0.2
  line_noise: 0.05
  mode: via
  via_noise: 0.01

snapshots: [0.01, 0.02, 0.05, 0.1, 0.2, 0.35, 0.5, 0.7, 0.85, 1.0]
